<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDE | InnovArqZ Soluciones Integrales S.A.S.</title>
    <link rel="stylesheet" href="styles.css">
    
    <!-- SDK de Supabase & PDF.js -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
</head>
<body>
    <header class="navbar">
        <div class="logo">Innov<span>ArqZ</span> <small>CDE ISO 19650</small></div>
        <div class="user-info" id="userInfo">Cargando usuario...</div>
    </header>

    <div class="container">
        <!-- PANTALLA DE LOGIN -->
        <div id="loginView" class="card login-card">
            <h2>Acceso al Portal CDE</h2>
            <form id="loginForm">
                <input type="email" id="emailInput" placeholder="Correo electrónico" required>
                <input type="password" id="passwordInput" placeholder="Contraseña" required>
                <button type="submit" class="btn-primary">Iniciar Sesión</button>
            </form>
        </div>

        <!-- DASHBOARD DEL CDE -->
        <div id="dashboardView" class="dashboard-hidden">
            <div class="controls-bar card">
                <div class="control-group">
                    <label for="projectSelect">Proyecto Activo:</label>
                    <select id="projectSelect"></select>
                </div>
                <button id="btnNewProject" class="btn-secondary" style="display:none;">+ Nuevo Proyecto</button>
            </div>

            <div class="tabs">
                <button class="tab-btn active" data-tab="01_WIP">01_WIP (Trabajo en Progreso)</button>
                <button class="tab-btn" data-tab="02_SHARED">02_SHARED (Compartido)</button>
                <button class="tab-btn" data-tab="03_PUBLISHED">03_PUBLISHED (Publicado)</button>
                <button class="tab-btn" data-tab="04_ARCHIVED">04_ARCHIVED (Archivado)</button>
            </div>

            <div class="card table-card">
                <table id="filesTable">
                    <thead>
                        <tr>
                            <th>Nombre del Archivo (ISO 19650)</th>
                            <th>Discipl.</th>
                            <th>Estado</th>
                            <th>Versión</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="filesTableBody">
                        <tr><td colspan="5">Seleccione un proyecto para cargar archivos.</td></tr>
                    </tbody>
                </table>
            </div>

            <!-- CONTENEDOR MULTIMEDIA DE VISORES (PDF, IMÁGENES & VIDEOS) -->
            <div id="viewerContainer" class="card viewer-card hidden" style="position: relative;">
                <button class="close-viewer" onclick="closeViewer()" style="position: absolute; top: 12px; right: 12px; z-index: 1000; cursor: pointer;">✕</button>
                
                <!-- Visor 2D (Iframe para PDFs e Imágenes) -->
                <div id="pdfViewerCanvas" style="display: none;"></div>
                <iframe id="ifcViewerFrame" src="" frameborder="0" style="width: 100%; height: 550px; border: none; display: none;"></iframe>
                
                <!-- Reproductor de Video Nativo (.mp4, .webm) -->
                <video id="videoViewerTag" controls style="width: 100%; height: 550px; background: #000; display: none; border-radius: 8px;"></video>
            </div>
        </div>
    </div>

    <!-- MODAL CREACIÓN DE PROYECTO CON DROPDOWNS -->
    <div id="projectModal" class="modal-hidden">
        <div class="modal-content card">
            <h3>Crear Nuevo Proyecto en CDE</h3>
            <form id="createProjectForm">
                <label><small>Código Autogenerado:</small></label>
                <input type="text" id="codigoProj" placeholder="Código (Ej: PRY2026-001)" required readonly>

                <label><small>Cliente:</small></label>
                <input type="text" id="clienteProj" placeholder="Cliente (Ej: AlcaldiaPasto)" required>

                <label><small>Ubicación:</small></label>
                <select id="ubicacionSelect" required>
                    <option value="">-- Seleccionar Ubicación --</option>
                    <option value="Pasto">Pasto</option>
                    <option value="Ricaurte">Ricaurte</option>
                    <option value="Tumaco">Tumaco</option>
                    <option value="Ipiales">Ipiales</option>
                    <option value="Mallama">Mallama</option>
                    <option value="OTRO">Otro...</option>
                </select>
                <input type="text" id="ubicacionOtherInput" placeholder="Escriba la ubicación" style="display:none; margin-top:5px;">

                <label><small>Tipo de Obra:</small></label>
                <select id="tipoSelect" required>
                    <option value="">-- Seleccionar Tipo --</option>
                    <option value="EdificioResidencial">Edificio Residencial</option>
                    <option value="InfraestructuraVial">Infraestructura Vial</option>
                    <option value="EquipamientoEducativo">Equipamiento Educativo</option>
                    <option value="Remodelacion">Remodelación</option>
                    <option value="OTRO">Otro...</option>
                </select>
                <input type="text" id="tipoOtherInput" placeholder="Escriba el tipo de obra" style="display:none; margin-top:5px;">

                <div class="modal-actions" style="margin-top:15px;">
                    <button type="button" class="btn-secondary" onclick="closeProjectModal()">Cancelar</button>
                    <button type="submit" class="btn-primary">Crear en Drive y CDE</button>
                </div>
            </form>
        </div>
    </div>

    <script src="viewer.js"></script>
    <script src="app.js"></script>
</body>
</html>
